name: Terraform CI/CD

on:
  push:
    branches: [main]
    paths: ["Task2Advanced/**"]
  pull_request:
    branches: [main]
    paths: ["Task2Advanced/**"]

permissions:
  contents: read
  pull-requests: write

env:
  TF_VERSION: "1.9.5"
  WORKDIR: Task2Advanced
  AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_ACCESS_KEY }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_SECRET_KEY }}
  YC_TOKEN: ${{ secrets.YC_TOKEN }}
  TF_VAR_cloud_id: ${{ secrets.YC_CLOUD_ID }}
  TF_VAR_folder_id: ${{ secrets.YC_FOLDER_ID }}
  TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
  TF_VAR_subnet_id: ${{ secrets.SUBNET_ID }}
  TF_VAR_boot_image_id: ${{ secrets.BOOT_IMAGE_ID }}
  TF_VAR_environment: dev

jobs:
  validate-plan:
    name: Validate & Plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKDIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init (remote backend)
        run: terraform init -backend-config=backend.dev.hcl

      - name: Validate
        run: terraform validate

      - name: Plan
        run: terraform plan -var-file=dev.tfvars -out=tfplan

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: ${{ env.WORKDIR }}/tfplan
          retention-days: 5

  apply:
    name: Apply (manual approval)
    needs: validate-plan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: ${{ env.WORKDIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Init (remote backend)
        run: terraform init -backend-config=backend.dev.hcl

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: ${{ env.WORKDIR }}

      - name: Apply
        run: terraform apply -auto-approve tfplan
